<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriAI - تشخيص المرض</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .corner-bracket {
      width: 28px;
      height: 28px;
      position: absolute;
      border-color: #ffffff;
      border-style: solid;
    }
    .corner-tl {
      top: -2px;
      left: -2px;
      border-width: 3.5px 0 0 3.5px;
      border-top-left-radius: 8px;
    }
    .corner-tr {
      top: -2px;
      right: -2px;
      border-width: 3.5px 3.5px 0 0;
      border-top-right-radius: 8px;
    }
    .corner-bl {
      bottom: -2px;
      left: -2px;
      border-width: 0 0 3.5px 3.5px;
      border-bottom-left-radius: 8px;
    }
    .corner-br {
      bottom: -2px;
      right: -2px;
      border-width: 0 3.5px 3.5px 0;
      border-bottom-right-radius: 8px;
    }
    .scan-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22c55e, #86efac, #22c55e, transparent);
      box-shadow: 0 0 12px 2px rgba(34, 197, 94, 0.7);
      animation: scanAnim 2.8s ease-in-out infinite alternate;
    }
    @keyframes scanAnim {
      0% { top: 12%; opacity: 0.7; }
      100% { top: 88%; opacity: 0.95; }
    }
  </style>
</head>
<body class="bg-[#022117] flex justify-center items-center min-h-screen p-0 m-0">

  <!-- Mobile Device Container -->
  <div class="w-full max-w-[412px] h-[892px] bg-[#064E36] text-white flex flex-col justify-between relative overflow-hidden shadow-2xl">
    
    <!-- Camera Frame & Top Elements -->
    <div class="flex-1 flex flex-col relative z-10">
      
      <!-- iOS Status Bar -->
      <div class="px-7 pt-3 pb-1 flex justify-between items-center text-xs tracking-wide text-white/90">
        <span class="font-bold text-sm tracking-tight">9:41</span>
        <!-- Dynamic Island / Sensor Notch Pill -->
        <div class="w-24 h-5 bg-black/60 rounded-full flex items-center justify-center">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/80 mr-1 animate-pulse"></div>
        </div>
        <div class="flex items-center space-x-1.5 space-x-reverse">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
          <div class="w-5 h-2.5 border border-white/90 rounded-sm p-0.5 flex items-center">
            <div class="h-full w-3.5 bg-white rounded-2xs"></div>
          </div>
        </div>
      </div>

      <!-- Top Navigation Header -->
      <div class="px-5 pt-3 pb-3 flex items-center justify-between">
        <!-- Back Arrow (Right in RTL points back to right) -->
        <button class="w-10 h-10 rounded-full bg-black/35 backdrop-blur-md border border-white/10 flex items-center justify-center hover:bg-black/50 transition active:scale-95 text-white">
          <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>

        <!-- Center Screen Title -->
        <h1 class="text-xl font-bold tracking-normal text-white">تشخيص المرض</h1>

        <!-- Selected Crop Badge -->
        <div class="flex items-center space-x-1.5 space-x-reverse px-3 py-1.5 rounded-full bg-emerald-950/70 border border-emerald-400/30 backdrop-blur-md shadow-sm">
          <!-- Wheat Icon -->
          <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v20M8 5l4-2 4 2M7 9l5-2 5 2M6 13l6-2 6 2M7 17l5-2 5 2" />
          </svg>
          <span class="text-xs font-semibold text-emerald-100">القمح</span>
        </div>
      </div>

      <!-- Instruction Tip Pill -->
      <div class="px-5 mb-2 flex justify-center">
        <div class="bg-black/40 backdrop-blur-md px-3.5 py-1 rounded-full border border-white/10 flex items-center space-x-2 space-x-reverse text-xs text-white/90">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span>ضع ورقة النبات المصابة داخل الإطار المخصص</span>
        </div>
      </div>

      <!-- Live Camera Viewport Area -->
      <div class="relative flex-1 mx-4 my-1 rounded-3xl overflow-hidden border border-white/15 shadow-inner flex items-center justify-center bg-black">
        <!-- Live Camera Feed Image: Wheat Leaf with Yellow Rust -->
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1QCtVLRl6xg_oJHh4ZonBtiQZNErSWLXcMvlkwjZFjT1H0qkYj6WSYgaUhkIUZyHQSsFLCG5QjS_bwZyj3NQjCdBQ313pxtLEUxpuwSBSMKnCmFbZNJuleHqOxbgumRUFLLb7rkzT6MTGsNj8OSJqSNwNfRUj0DxUWiEoDDd0vJ8WEUp4bDM4W8vXPIO26ggGSWQSItjeDr0GnEFAbMFBr-dV1_WjRpk-MoAaE8knQkG0WURR-l8" alt="فحص ورقة القمح المصابة بالصدأ الأصفر" class="absolute inset-0 w-full h-full object-cover brightness-95 contrast-105" />

        <!-- Camera Dark Vignette Overlay -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/60 pointer-events-none"></div>

        <!-- Scanning Laser Line -->
        <div class="scan-laser pointer-events-none"></div>

        <!-- Target Bounding Box / Corner Brackets Viewfinder -->
        <div class="relative w-[78%] h-[74%] pointer-events-none flex flex-col justify-between">
          <!-- 4 White Corner Brackets -->
          <div class="corner-bracket corner-tl shadow-sm"></div>
          <div class="corner-bracket corner-tr shadow-sm"></div>
          <div class="corner-bracket corner-bl shadow-sm"></div>
          <div class="corner-bracket corner-br shadow-sm"></div>

          <!-- Top Status within Scan Box -->
          <div class="flex justify-between items-start p-2">
            <div class="px-2 py-0.5 bg-black/60 rounded text-[10px] text-emerald-300 font-mono tracking-wider flex items-center space-x-1 space-x-reverse">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
              <span>AI FOCUS: AUTO</span>
            </div>
            <div class="text-[10px] font-mono text-white/70 bg-black/60 px-1.5 py-0.5 rounded">4K 60FPS</div>
          </div>

          <!-- Detected Disease Indicator Pill inside frame -->
          <div class="self-center mb-2 px-3 py-1.5 bg-[#064E36]/90 backdrop-blur-md rounded-full border border-emerald-400/50 flex items-center space-x-2 space-x-reverse shadow-lg animate-bounce">
            <span class="text-amber-300">
              <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
            </span>
            <span class="text-xs font-semibold text-white">رصد أعراض: صدأ القمح الأصفر</span>
          </div>
        </div>

        <!-- Camera Controls: Shutter, Gallery, Flash (overlayed at bottom of preview) -->
        <div class="absolute bottom-3 inset-x-0 px-8 flex items-center justify-between z-20">
          <!-- Gallery Quick Access (Left) -->
          <button class="w-11 h-11 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center text-white hover:bg-black/70 active:scale-90 transition">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </button>

          <!-- Circular Shutter Capture Button (Center) -->
          <button class="relative w-18 h-18 p-1 rounded-full border-[3.5px] border-white/90 flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-2xl">
            <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-inner">
              <div class="w-12 h-12 rounded-full border-2 border-emerald-700/30 bg-gradient-to-tr from-emerald-100 to-white flex items-center justify-center">
                <svg class="w-6 h-6 text-[#064E36]" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                  <circle cx="12" cy="13" r="3"/>
                </svg>
              </div>
            </div>
          </button>

          <!-- Flash Toggle Button (Right) -->
          <button class="w-11 h-11 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center text-white hover:bg-black/70 active:scale-90 transition">
            <svg class="w-5 h-5 text-amber-300" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.381z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>

    </div>

    <!-- White Rounded Bottom Sheet ("اختر طريقة الإدخال") -->
    <div class="bg-white text-slate-800 rounded-t-[32px] pt-3 px-6 pb-6 shadow-[0_-10px_35px_rgba(0,0,0,0.3)] z-30 relative">
      <!-- Drag Handle Notch -->
      <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>

      <!-- Sheet Title Header -->
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-base font-bold text-[#064E36] tracking-tight">اختر طريقة الإدخال</h2>
          <p class="text-[11px] text-slate-500 font-medium mt-0.5">التقط صورة جديدة أو ارفع صورة محفوظة لتحليلها</p>
        </div>
        <span class="p-1.5 bg-emerald-50 text-emerald-700 rounded-lg">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </span>
      </div>

      <!-- Two Bordered Input Method Cards (Equally Sized) -->
      <div class="grid grid-cols-2 gap-3 mb-2">
        
        <!-- Card 1: رفع صورة من المعرض -->
        <button class="group p-3.5 rounded-2xl border-2 border-slate-200 hover:border-emerald-600 bg-slate-50/70 hover:bg-emerald-50/40 text-right transition flex flex-col items-start justify-between min-h-[92px] active:scale-[0.98]">
          <div class="w-10 h-10 rounded-xl bg-emerald-100/70 text-[#087B55] flex items-center justify-center mb-2 group-hover:scale-110 transition shadow-xs">
            <!-- Gallery Icon -->
            <svg class="w-5 h-5 text-[#064E36]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-800 group-hover:text-[#064E36]">رفع من المعرض</div>
            <div class="text-[10px] text-slate-400 mt-0.5 font-medium">ملف صورة أو لقطة</div>
          </div>
        </button>

        <!-- Card 2: التقاط صورة جديدة (Active / Highlighted) -->
        <button class="group p-3.5 rounded-2xl border-2 border-[#064E36] bg-emerald-50/60 text-right transition flex flex-col items-start justify-between min-h-[92px] relative active:scale-[0.98] shadow-sm">
          <!-- Active Green Dot Indicator -->
          <div class="absolute top-3 left-3 w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>

          <div class="w-10 h-10 rounded-xl bg-[#064E36] text-white flex items-center justify-center mb-2 group-hover:scale-110 transition shadow-xs">
            <!-- Camera Icon -->
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
              <circle cx="12" cy="13" r="3" />
            </svg>
          </div>
          <div>
            <div class="text-xs font-bold text-[#064E36]">التقاط صورة جديدة</div>
            <div class="text-[10px] text-emerald-700/80 mt-0.5 font-medium">عبر الكاميرا الآن</div>
          </div>
        </button>

      </div>

      <!-- Home Indicator Bar -->
      <div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div>
    </div>

  </div>

</body>
</html>
